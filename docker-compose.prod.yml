services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - '8000:8000'
    env_file:
      - .env.prod
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - NODE_ENV=production
    command: >
      sh -c 'npm run migration:up:prod && npm run start:prod'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env.prod
    environment:
      - POSTGRES_DB=$DATABASE_NAME
      - POSTGRES_USER=$DATABASE_USERNAME
      - POSTGRES_PASSWORD=$DATABASE_PASSWORD
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
